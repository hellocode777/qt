[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qp"
version = "0.0.1"
description = "Quant Platform — Personal Quantitative Research & Investment Decision Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "hellocode777"},
]
keywords = ["quantitative", "investment", "research", "trading", "backtest"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "apscheduler>=3.10",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "polars>=1.0",
    "lightgbm>=4.0",
    "akshare>=1.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pandera>=0.32.1",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
qp = "qp.platform.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["qp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["qp"]
exclude = ["tests", ".venv"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
