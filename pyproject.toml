[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qp"
version = "0.0.1"
description = "Quant Platform — Personal Quantitative Research & Investment Decision Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "hellocode777"},
]
keywords = ["quantitative", "investment", "research", "trading", "backtest"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "apscheduler>=3.10",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "polars>=1.0",
    "lightgbm>=4.0",
    "akshare>=1.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pandera>=0.32.1",
    "networkx>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx2>=2.9.1",
    "click>=8.4.2",
]

[project.scripts]
qp = "qp.platform.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["qp"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
exclude = ["*.html"]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RET", # flake8-return
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    # 中文代码库误报: 中文注释/字符串被判定为歧义 Unicode 字符
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    # Pydantic v2 模型类属性误报: BaseModel 会自动深拷贝默认值, 无共享可变状态
    "RUF012", # mutable-class-default
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["qp"]
exclude = ["tests", ".venv"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "pre-commit>=4.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.11",
]

[tool.mypy]
python_version = "3.12"
files = ["qp"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
exclude = ["tests/", ".venv/"]
