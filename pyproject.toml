[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qp"
version = "0.0.1"
description = "Quant Platform — Personal Quantitative Research & Investment Decision Operating System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "hellocode777" },
]
keywords = ["quantitative", "investment", "research", "trading", "backtest"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "apscheduler>=3.10",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "polars>=1.0",
    "lightgbm>=4.0",
    "akshare>=1.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pandera>=0.20.0", # 修正为合理的 pandera 版本区间
    "networkx>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",   # 修正为官方标准库 httpx
    "click>=8.1",
]

# 统一采用 PEP 735 标准声明开发依赖（移除了旧的 optional-dependencies.dev）
[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
qp = "qp.platform.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["qp"]

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
exclude = ["*.html"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (Security)
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --import-mode=importlib"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["qp", "tests"]
exclude = [".venv"]
reportMissingTypeStubs = false
reportUnknownMemberType = false