name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 防止同一个 PR 重复提交时浪费 CI 资源，自动取消旧的运行任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 关于依赖版本：uv.lock 未纳入版本控制（.gitignore），因此 CI 上 `uv sync --dev`
# 会重新解析并装到满足 pyproject 的最新版（实测 click 从 8.4.2 变成 8.5.0）。
# 因此凡是由代码生成的产物（如 docs/command_reference.md）必须对依赖版本健壮：
# 不要渲染依赖库的内部实现细节（click 8.5 把未声明 default 的 flag 从 False 改成
# Sentinel.UNSET，曾让文档守卫在零 CLI 变更下报 STALE）。
# 守卫：tests/unit/test_docs_command_reference.py 的
# test_flag_default_ignores_click_unset_sentinel / test_generated_doc_is_time_independent。
# 若要让 CI 与本地环境完全一致，需先 `git add -f uv.lock` 再把这里的 uv 命令加 --frozen。

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # Ruff 不需要安装项目依赖，使用 uvx 直接免安装极速运行
      - name: Ruff Check
        run: uvx ruff check .

      - name: Ruff Format
        run: uvx ruff format --check .

  typecheck:
    name: Mypy
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Pyright
        run: uv run pyright

      # mypy 渐进式接入: polars 动态类型噪音多(328 errors), 先跑不阻塞, 后续逐步清零
      - name: Run Mypy (progressive)
        continue-on-error: true
        run: uv run mypy qp

  tests:
    name: Pytest
    needs: lint  # 解绑 typecheck，让 Mypy 和 Pytest 在 Lint 通过后并行运行
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Pytest
        run: |
          uv run pytest \
            --cov=qp \
            --cov-report=term-missing \
            --cov-report=xml

  cli-smoke:
    name: CLI Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: qp version
        run: uv run qp version

      - name: qp doctor
        run: uv run qp doctor

      - name: qp --help
        run: uv run qp --help
